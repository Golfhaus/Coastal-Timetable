<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coastal American Airways — Timetable</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --navy-deep:   #0b2e4a;
    --navy:        #0f4c81;
    --navy-light:  #2f6fa8;
    --coral:       #e6741e;
    --coral-dark:  #c25e12;
    --cream:       #f6f2e9;
    --paper:       #fffdf8;
    --ink:         #1c2530;
    --ink-soft:    #5c6b78;
    --line:        #d9d2c1;
    --hub-tag:     #0f4c81;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--cream);
    color:var(--ink);
    font-family:'Inter',system-ui,sans-serif;
    min-height:100vh;
  }

  /* ---------- header ---------- */
  header{
    background:linear-gradient(180deg,var(--navy-deep),var(--navy) 140%);
    padding:22px 20px 26px;
    color:var(--paper);
    box-shadow:0 3px 0 var(--coral);
  }
  .header-inner{
    max-width:960px;
    margin:0 auto;
    display:flex;
    align-items:center;
    gap:18px;
  }
  .logo-wrap{
    background:var(--paper);
    border-radius:8px;
    padding:8px 12px;
    flex-shrink:0;
  }
  .logo-wrap img{
    display:block;
    height:34px;
    width:auto;
  }
  .brand-text .eyebrow{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--coral);
    margin:0 0 2px;
  }
  .brand-text h1{
    font-family:'Oswald',sans-serif;
    font-weight:600;
    font-size:26px;
    letter-spacing:.02em;
    margin:0;
    text-transform:uppercase;
  }

  /* ---------- controls ---------- */
  .controls{
    max-width:960px;
    margin:-16px auto 0;
    padding:0 20px;
  }
  .controls-card{
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:10px;
    padding:16px;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
    box-shadow:0 6px 18px rgba(11,46,74,.10);
  }
  @media (max-width:640px){
    .controls-card{grid-template-columns:1fr;}
  }
  .field label{
    display:block;
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--ink-soft);
    margin-bottom:6px;
  }
  select{
    width:100%;
    font-family:'Inter',sans-serif;
    font-size:14.5px;
    font-weight:500;
    color:var(--ink);
    background:var(--cream);
    border:1.5px solid var(--line);
    border-radius:6px;
    padding:10px 10px;
    appearance:none;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='9'><path d='M1 1l6 6 6-6' fill='none' stroke='%235c6b78' stroke-width='1.6'/></svg>");
    background-repeat:no-repeat;
    background-position:right 10px center;
    padding-right:30px;
  }
  select:focus{
    outline:none;
    border-color:var(--coral);
    box-shadow:0 0 0 3px rgba(230,116,30,.18);
  }
  select:disabled{opacity:.5;}

  /* ---------- main / results ---------- */
  main{
    max-width:960px;
    margin:0 auto;
    padding:26px 20px 60px;
  }

  .status-line{
    font-family:'IBM Plex Mono',monospace;
    font-size:12.5px;
    color:var(--ink-soft);
    margin:2px 4px 18px;
  }

  .empty-state{
    text-align:center;
    padding:60px 20px;
    color:var(--ink-soft);
    font-family:'IBM Plex Mono',monospace;
    font-size:13.5px;
    border:1.5px dashed var(--line);
    border-radius:10px;
    background:var(--paper);
  }

  .city-header{
    display:flex;
    align-items:baseline;
    gap:10px;
    margin:26px 0 10px;
    border-bottom:2px solid var(--navy);
    padding-bottom:6px;
  }
  .city-header:first-of-type{margin-top:0;}
  .city-header h2{
    font-family:'Oswald',sans-serif;
    font-size:19px;
    font-weight:600;
    letter-spacing:.02em;
    color:var(--navy-deep);
    margin:0;
    text-transform:uppercase;
  }
  .city-header .code{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    color:var(--coral-dark);
    font-weight:600;
  }
  .stop-tag{
    margin-left:auto;
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--paper);
    background:var(--navy-light);
    padding:3px 8px;
    border-radius:999px;
  }
  .stop-tag.nonstop{background:#2f7d5c;}
  .stop-tag.stop2{background:var(--coral-dark);}

  .itinerary{
    background:var(--paper);
    border:1px solid var(--line);
    border-left:4px solid var(--navy);
    border-radius:6px;
    padding:10px 12px;
    margin-bottom:8px;
    font-family:'IBM Plex Mono',monospace;
    font-size:13px;
  }
  .itinerary.nonstop{border-left-color:#2f7d5c;}
  .itinerary.stop2{border-left-color:var(--coral-dark);}

  .leg{
    display:grid;
    grid-template-columns:52px 1fr auto auto 70px;
    gap:10px;
    align-items:center;
    padding:3px 0;
  }
  .leg + .leg{border-top:1px dashed var(--line);margin-top:3px;padding-top:6px;}
  .leg .fn{color:var(--navy);font-weight:600;}
  .leg .fn.max9{color:var(--coral-dark);font-weight:700;}
  .leg .route{color:var(--ink);}
  .leg .time{color:var(--ink);white-space:nowrap;}
  .leg .fleet{
    text-align:right;
    color:var(--ink-soft);
    font-size:11.5px;
  }
  .leg .fleet.max9{color:var(--coral-dark);font-weight:700;}
  .connect-note{
    font-size:11px;
    color:var(--ink-soft);
    padding:3px 0 0 62px;
  }

  @media (max-width:520px){
    .leg{grid-template-columns:40px 1fr auto;grid-template-rows:auto auto;}
    .leg .time{grid-column:1/3;}
    .leg .fleet{grid-column:3;text-align:right;}
  }

  footer{
    text-align:center;
    padding:18px 20px 34px;
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    color:var(--ink-soft);
  }

  /* ---------- per-flight connections ---------- */
  .leg-clickable{cursor:pointer;}
  .leg-clickable:hover{background:rgba(15,76,129,.07);border-radius:4px;}
  .leg.leg-active{background:rgba(230,116,30,.09);border-radius:4px;}

  .leg-connections{
    margin:6px 0 10px;
    padding:10px 12px;
    background:var(--cream);
    border:1px solid var(--line);
    border-left:4px solid var(--coral);
    border-radius:6px;
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
  }
  .conn-header{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    font-weight:600;
    color:var(--navy-deep);
    margin-bottom:8px;
    padding-bottom:6px;
    border-bottom:1px dashed var(--line);
  }
  .conn-close{
    cursor:pointer;
    color:var(--ink-soft);
    font-size:10.5px;
    letter-spacing:.06em;
    text-transform:uppercase;
    font-weight:500;
  }
  .conn-close:hover{color:var(--coral-dark);}
  .conn-group + .conn-group{margin-top:10px;}
  .conn-group-title{
    font-size:10.5px;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:var(--ink-soft);
    margin-bottom:4px;
  }
  .conn-row{
    display:grid;
    grid-template-columns:52px 1fr auto 60px;
    gap:8px;
    align-items:center;
    padding:3px 0;
  }
  .conn-row + .conn-row{border-top:1px dashed var(--line);margin-top:2px;padding-top:5px;}
  .conn-row .fn{color:var(--navy);font-weight:600;}
  .conn-row .fn.max9{color:var(--coral-dark);font-weight:700;}
  .conn-row .route{color:var(--ink);}
  .conn-row .conn-destname{color:var(--ink-soft);font-size:10.5px;}
  .conn-row .time{white-space:nowrap;}
  .conn-row .wait{text-align:right;color:var(--ink-soft);font-size:11px;}
  .conn-empty{color:var(--ink-soft);font-style:italic;padding:4px 0;}

  @media (max-width:520px){
    .conn-row{grid-template-columns:40px 1fr auto;grid-template-rows:auto auto;}
    .conn-row .time{grid-column:1/3;}
    .conn-row .wait{grid-column:3;text-align:right;}
  }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="logo-wrap"><img src="assets/coastal_logo.png" alt="Coastal American Airways"></div>
    <div class="brand-text">
      <p class="eyebrow">Coastal American Airways</p>
      <h1>Timetable</h1>
    </div>
  </div>
</header>

<div class="controls">
  <div class="controls-card">
    <div class="field">
      <label for="scheduleSelect">Schedule</label>
      <select id="scheduleSelect"></select>
    </div>
    <div class="field">
      <label for="citySelect">City</label>
      <select id="citySelect" disabled><option>Loading…</option></select>
    </div>
    <div class="field">
      <label for="connSelect">Connections</label>
      <select id="connSelect">
        <option value="nonstop">Non-stop</option>
        <option value="1">1 Connection</option>
        <option value="2">2 Connections</option>
        <option value="all" selected>All</option>
      </select>
    </div>
  </div>
</div>

<main>
  <div id="statusLine" class="status-line"></div>
  <div id="results"><div class="empty-state">Select a city to view its timetable.</div></div>
</main>

<footer id="footerNote"></footer>

<script>
// Connection-window bounds are a property of the loaded schedule, not a fixed
// constant -- read from currentSchedule.minConnect / currentSchedule.maxConnect
// (set in loadSchedule()) rather than hardcoded here.

let currentSchedule = null; // full schedule JSON currently loaded
let flightsByOrigin = new Map();
let flightsByDest = new Map();   // mirror index, needed for inbound-connection lookups
let hubCodes = new Set();        // city codes with isHub true, for the connections feature

// Cities treated as hubs for the connections feature only, beyond whatever
// the schedule's own isHub flags say -- this does NOT alter isHub anywhere
// else in the app (city dropdown tags, footer, etc. still read the real flag).
// BHM is included here because its role is connection relief, even though
// it's schema'd as a focus city rather than a hub.
const CONNECTIONS_HUB_OVERRIDE = new Set(['BHM']);

function toMinutes(hhmm){
  const [h,m] = hhmm.split(':').map(Number);
  return h*60+m;
}

// Modular "minutes since departure" wait time, since the whole network
// repeats on a 24-hour cycle rather than running on fixed calendar days.
function waitMinutes(arr, dep){
  let w = toMinutes(dep) - toMinutes(arr);
  if (w < 0) w += 1440;
  return w;
}

function buildIndex(schedule){
  flightsByOrigin = new Map();
  flightsByDest = new Map();
  hubCodes = new Set();
  // __idx tags each flight object with its position in schedule.flights, so a
  // click on any rendered leg (which is always the same object reference,
  // never a copy) can be traced straight back to one unambiguous flight --
  // safer than keying off flight number, which the schema never guarantees is unique.
  schedule.flights.forEach((f, i) => {
    f.__idx = i;
    if(!flightsByOrigin.has(f.origin)) flightsByOrigin.set(f.origin, []);
    flightsByOrigin.get(f.origin).push(f);
    if(!flightsByDest.has(f.dest)) flightsByDest.set(f.dest, []);
    flightsByDest.get(f.dest).push(f);
  });
  for(const c of schedule.cities){
    if(c.isHub) hubCodes.add(c.code);
  }
  for(const code of CONNECTIONS_HUB_OVERRIDE) hubCodes.add(code);
}

function cityName(code){
  const c = currentSchedule.cities.find(c=>c.code===code);
  return c ? c.name : code;
}

// ---- itinerary search ----------------------------------------------
function findNonstops(originCode){
  return (flightsByOrigin.get(originCode) || []).map(f => ({legs:[f], stops:0, dest:f.dest}));
}

function findOneStops(originCode){
  const out = [];
  const minConnect = currentSchedule.minConnect ?? 30;
  const maxWait = currentSchedule.maxConnect ?? 240;
  const firstLegs = flightsByOrigin.get(originCode) || [];
  for(const leg1 of firstLegs){
    const secondLegs = flightsByOrigin.get(leg1.dest) || [];
    for(const leg2 of secondLegs){
      if(leg2.dest === originCode) continue; // ignore trivial round-trip back
      const wait = waitMinutes(leg1.arr, leg2.dep);
      if(wait >= minConnect && wait <= maxWait){
        out.push({legs:[leg1,leg2], stops:1, dest:leg2.dest, waits:[wait]});
      }
    }
  }
  return out;
}

function findTwoStops(originCode){
  const out = [];
  const minConnect = currentSchedule.minConnect ?? 30;
  const maxWait = currentSchedule.maxConnect ?? 240;
  const firstLegs = flightsByOrigin.get(originCode) || [];
  for(const leg1 of firstLegs){
    const secondLegs = flightsByOrigin.get(leg1.dest) || [];
    for(const leg2 of secondLegs){
      if(leg2.dest === originCode) continue;
      const wait1 = waitMinutes(leg1.arr, leg2.dep);
      if(wait1 < minConnect || wait1 > maxWait) continue;
      const thirdLegs = flightsByOrigin.get(leg2.dest) || [];
      for(const leg3 of thirdLegs){
        if(leg3.dest === originCode || leg3.dest === leg1.dest) continue;
        const wait2 = waitMinutes(leg2.arr, leg3.dep);
        if(wait2 < minConnect || wait2 > maxWait) continue;
        out.push({legs:[leg1,leg2,leg3], stops:2, dest:leg3.dest, waits:[wait1,wait2]});
      }
    }
  }
  return out;
}

// Cap how many itinerary options we show per destination so well-connected
// hub pairs don't bury the page. Shortest total wait time wins.
function capPerDestination(itins, max){
  const byDest = new Map();
  for(const it of itins){
    if(!byDest.has(it.dest)) byDest.set(it.dest, []);
    byDest.get(it.dest).push(it);
  }
  const result = [];
  for(const [dest, list] of byDest){
    list.sort((a,b) => (a.waits||[0]).reduce((s,x)=>s+x,0) - (b.waits||[0]).reduce((s,x)=>s+x,0));
    result.push(...list.slice(0, max));
  }
  return result;
}

function renderLeg(leg){
  const isMax9 = leg.fleet === 'MAX9';
  // Only worth a click if the flight touches a hub on at least one end --
  // a pure point-to-point leg has no connections to show either direction.
  const clickable = hubCodes.has(leg.origin) || hubCodes.has(leg.dest);
  return `<div class="leg${clickable?' leg-clickable':''}" data-idx="${leg.__idx}">
    <span class="fn ${isMax9?'max9':''}">${leg.flight}</span>
    <span class="route">${leg.origin} → ${leg.dest}</span>
    <span class="time">${leg.dep}–${leg.arr}</span>
    <span class="fleet ${isMax9?'max9':''}">${leg.fleet}</span>
  </div>`;
}

function renderItinerary(it){
  const cls = it.stops===0?'nonstop':(it.stops===2?'stop2':'');
  let html = `<div class="itinerary ${cls}">`;
  it.legs.forEach((leg,i)=>{
    html += renderLeg(leg);
    if(it.waits && it.waits[i]!==undefined){
      const h = Math.floor(it.waits[i]/60), m = it.waits[i]%60;
      html += `<div class="connect-note">connect at ${leg.dest} · ${h?h+'h ':''}${m}m</div>`;
    }
  });
  html += `</div>`;
  return html;
}

function render(originCode, connFilter){
  const results = document.getElementById('results');
  let all = [];

  if(connFilter === 'nonstop'){
    all = findNonstops(originCode);
  } else if(connFilter === '1'){
    all = findOneStops(originCode);
  } else if(connFilter === '2'){
    all = capPerDestination(findTwoStops(originCode), 3);
  } else { // all
    const nonstopDests = new Set();
    const ns = findNonstops(originCode);
    ns.forEach(it => nonstopDests.add(it.dest));

    const os = findOneStops(originCode).filter(it => !nonstopDests.has(it.dest));
    const osDests = new Set(os.map(it=>it.dest));
    const osCapped = capPerDestination(os, 2);
    const osCappedDests = new Set(osCapped.map(it=>it.dest));

    const ts = findTwoStops(originCode).filter(it => !nonstopDests.has(it.dest) && !osDests.has(it.dest));
    const tsCapped = capPerDestination(ts, 1);

    all = [...ns, ...osCapped, ...tsCapped];
  }

  if(all.length === 0){
    results.innerHTML = `<div class="empty-state">No itineraries found from ${cityName(originCode)} (${originCode}) for this filter.</div>`;
    return;
  }

  // group by destination, sorted by destination name
  const byDest = new Map();
  for(const it of all){
    if(!byDest.has(it.dest)) byDest.set(it.dest, []);
    byDest.get(it.dest).push(it);
  }
  const destCodes = [...byDest.keys()].sort((a,b)=>cityName(a).localeCompare(cityName(b)));

  let html = '';
  for(const dest of destCodes){
    const itins = byDest.get(dest).sort((a,b)=> a.stops-b.stops || toMinutes(a.legs[0].dep)-toMinutes(b.legs[0].dep));
    const bestStops = Math.min(...itins.map(i=>i.stops));
    const tagClass = bestStops===0?'nonstop':(bestStops===2?'stop2':'');
    const tagText = bestStops===0?'Non-stop':(bestStops===1?'1 stop':'2 stops');
    html += `<div class="city-header">
      <h2>${cityName(dest)}</h2>
      <span class="code">${dest}</span>
      <span class="stop-tag ${tagClass}">${tagText}</span>
    </div>`;
    itins.forEach(it => html += renderItinerary(it));
  }
  results.innerHTML = html;
}

// ---- per-flight connections (click a leg to see who connects to it) --
// Same [minConnect, maxConnect] window as the itinerary search, just
// anchored to one specific flight instead of run across a whole city.

function connectionsForFlight(flight){
  const minConnect = currentSchedule.minConnect ?? 30;
  const maxWait = currentSchedule.maxConnect ?? 240;
  const destHub = hubCodes.has(flight.dest);
  const originHub = hubCodes.has(flight.origin);

  let outbound = null, inbound = null;

  if(destHub){
    // Passengers landing on this flight -- what can they connect onward to?
    outbound = (flightsByOrigin.get(flight.dest) || [])
      .filter(f => f.__idx !== flight.__idx && f.dest !== flight.origin) // skip the trivial flight straight back
      .map(f => ({f, wait: waitMinutes(flight.arr, f.dep)}))
      .filter(x => x.wait >= minConnect && x.wait <= maxWait)
      .sort((a,b) => a.wait - b.wait);
  }

  if(originHub){
    // Passengers boarding this flight -- what could they have connected from?
    inbound = (flightsByDest.get(flight.origin) || [])
      .filter(f => f.__idx !== flight.__idx && f.origin !== flight.dest) // skip the trivial flight just arrived from there
      .map(f => ({f, wait: waitMinutes(f.arr, flight.dep)}))
      .filter(x => x.wait >= minConnect && x.wait <= maxWait)
      .sort((a,b) => a.wait - b.wait);
  }

  return {outbound, inbound, originHub, destHub};
}

function renderConnRow({f, wait}){
  const isMax9 = f.fleet === 'MAX9';
  const h = Math.floor(wait/60), m = wait%60;
  return `<div class="conn-row">
    <span class="fn ${isMax9?'max9':''}">${f.flight}</span>
    <span class="route">${f.origin} → ${f.dest} <span class="conn-destname">${cityName(f.dest)}</span></span>
    <span class="time">${f.dep}–${f.arr}</span>
    <span class="wait">${h?h+'h ':''}${m}m</span>
  </div>`;
}

function renderConnGroup(title, list){
  if(list.length === 0){
    return `<div class="conn-group"><div class="conn-group-title">${title} · 0</div>
      <div class="conn-empty">No valid connections in this window.</div></div>`;
  }
  return `<div class="conn-group"><div class="conn-group-title">${title} · ${list.length}</div>
    ${list.map(renderConnRow).join('')}</div>`;
}

function renderConnectionsPanel(flight){
  const {outbound, inbound, originHub, destHub} = connectionsForFlight(flight);
  let html = `<div class="conn-header">
    <span>Flight ${flight.flight} · ${flight.origin} → ${flight.dest}</span>
    <span class="conn-close">Close ✕</span>
  </div>`;

  if(destHub){
    html += renderConnGroup(`Outbound from ${cityName(flight.dest)} (${flight.dest})`, outbound);
  }
  if(originHub){
    html += renderConnGroup(`Inbound to ${cityName(flight.origin)} (${flight.origin})`, inbound);
  }
  if(!destHub && !originHub){
    html += `<div class="conn-empty">Point-to-point flight — neither end is a hub, so no connections apply.</div>`;
  }
  return html;
}

function toggleConnections(legEl, idx){
  const next = legEl.nextElementSibling;
  if(next && next.classList.contains('leg-connections')){
    next.remove();
    legEl.classList.remove('leg-active');
    return;
  }
  // Only one panel open at a time keeps this simple and legible.
  document.querySelectorAll('.leg-connections').forEach(p => p.remove());
  document.querySelectorAll('.leg.leg-active').forEach(l => l.classList.remove('leg-active'));

  const flight = currentSchedule.flights[idx];
  const panel = document.createElement('div');
  panel.className = 'leg-connections';
  panel.innerHTML = renderConnectionsPanel(flight);
  legEl.insertAdjacentElement('afterend', panel);
  legEl.classList.add('leg-active');
}

// ---- data loading ----------------------------------------------------
async function loadSchedules(){
  const res = await fetch('data/schedules.json');
  const manifest = await res.json();
  const sel = document.getElementById('scheduleSelect');
  sel.innerHTML = manifest.map(s => `<option value="${s.file}">${s.label}</option>`).join('');
  await loadSchedule(manifest[0].file);
  sel.addEventListener('change', () => loadSchedule(sel.value));
}

async function loadSchedule(file){
  const citySel = document.getElementById('citySelect');
  citySel.disabled = true;
  citySel.innerHTML = '<option>Loading…</option>';
  document.getElementById('results').innerHTML = '<div class="empty-state">Loading…</div>';

  const res = await fetch('data/' + file);
  currentSchedule = await res.json();
  buildIndex(currentSchedule);

  const sorted = [...currentSchedule.cities].sort((a,b)=>a.name.localeCompare(b.name));
  citySel.innerHTML = sorted.map(c => {
    const tag = c.isHub ? ' — Hub' : (c.isFocusCity ? ' — Focus City' : '');
    return `<option value="${c.code}">${c.name} (${c.code})${tag}</option>`;
  }).join('');
  citySel.disabled = false;

  document.getElementById('footerNote').textContent =
    `${currentSchedule.label} · ${currentSchedule.flightCount} flights · ${currentSchedule.cityCount} cities served · connections ${currentSchedule.minConnect ?? 30}\u2013${currentSchedule.maxConnect ?? 240} min`;
  document.getElementById('statusLine').textContent = '';
  document.getElementById('results').innerHTML = '<div class="empty-state">Select a city to view its timetable.</div>';
}

function refresh(){
  const city = document.getElementById('citySelect').value;
  const conn = document.getElementById('connSelect').value;
  if(!city) return;
  document.getElementById('statusLine').textContent =
    `${cityName(city)} (${city}) · ${document.getElementById('connSelect').selectedOptions[0].textContent}`;
  render(city, conn);
}

document.getElementById('citySelect').addEventListener('change', refresh);
document.getElementById('connSelect').addEventListener('change', refresh);

// Delegated on #results since itineraries are wholesale re-rendered on
// every refresh() -- listeners bound to individual legs would be lost each time.
document.getElementById('results').addEventListener('click', e => {
  const closeBtn = e.target.closest('.conn-close');
  if(closeBtn){
    const panel = closeBtn.closest('.leg-connections');
    const prevLeg = panel.previousElementSibling;
    if(prevLeg && prevLeg.classList.contains('leg')) prevLeg.classList.remove('leg-active');
    panel.remove();
    return;
  }
  const legEl = e.target.closest('.leg');
  if(!legEl || !legEl.classList.contains('leg-clickable')) return;
  toggleConnections(legEl, Number(legEl.dataset.idx));
});

loadSchedules();
</script>
</body>
</html>
